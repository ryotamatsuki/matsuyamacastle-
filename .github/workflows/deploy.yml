name: Build, validate and deploy castle
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: castle-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap exact dependency lock on first run
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
      - run: npm ci
      - run: npm test
      - name: Build browser validation edition
        run: npm run build
        env:
          VITE_TEST: '1'
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
      - name: Save actual browser screenshots
        run: |
          mkdir -p public/screenshots
          cp test-results/chromium-exterior.png public/screenshots/
          cp test-results/chromium-interior.png public/screenshots/
      - name: Build production without test mutation interface
        run: npm run build
      - name: Verify byte-identical model regeneration
        run: node scripts/check-reproducibility.mjs
      - name: Inspect actual GLB and rights-clean asset structure
        run: |
          python3 scripts/inspect_model.py
          cp public/data/model-report.json dist/data/model-report.json
      - name: Persist reproducible model, lockfile and notices
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/models public/screenshots public/data/dependency-notices.txt public/data/dependency-inventory.json public/data/model-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist generated GLB, exact dependency lock and notices"
            git push origin HEAD:main
          fi
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify published Pages URL and assets
        run: node scripts/verify-deployment.mjs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Preserve published-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: deployment-evidence/
